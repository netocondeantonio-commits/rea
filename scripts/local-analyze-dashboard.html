<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>REA local</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c1915;
        --muted: #5e574c;
        --line: #e3d9cc;
        --paper: #f6f1e8;
        --card: #fffdf8;
        --accent: #1f6b4a;
        --warn: #8a4b12;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --ink: #f3efe6;
        --muted: #c3b8a8;
        --line: #3d3830;
        --paper: #17140f;
        --card: #262219;
        --accent: #8dccb0;
        --warn: #f0b27a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Iowan Old Style", Palatino, Georgia, serif;
        background: var(--paper);
        color: var(--ink);
      }
      button, input, select { font: inherit; color: inherit; }
      header {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--card);
        position: sticky;
        top: 0;
      }
      nav, .tools { display: flex; gap: 6px; flex-wrap: wrap; }
      .tools { margin-left: auto; }
      nav button, .tools button, button.quiet {
        background: transparent;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
      }
      nav button[aria-current="page"] { border-color: var(--line); background: var(--paper); }
      main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 64px; }
      h1 { font-size: 1.8rem; font-weight: 600; margin: 0 0 8px; }
      h2 { font-size: 1.15rem; margin: 0 0 8px; }
      p { line-height: 1.45; }
      .muted { color: var(--muted); }
      .warn { color: var(--warn); }
      .light { display: inline-block; width: 0.75rem; height: 0.75rem; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
      .light.green { background: #1f6b4a; }
      .light.amber { background: #c47b12; }
      .light.red { background: #9b2c2c; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
      .card, form.card, table {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .card, form.card { padding: 14px; margin-top: 12px; }
      button.primary {
        background: var(--accent);
        color: white;
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        cursor: pointer;
      }
      :root[data-theme="dark"] button.primary { color: #14241c; }
      input, select, textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
      }
      label { display: block; margin: 10px 0; }
      table { width: 100%; border-collapse: collapse; margin-top: 12px; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
      .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .login form { width: min(440px, 100%); }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .map { max-width: 100%; background: white; border-radius: 8px; }
      a { color: var(--accent); }
      pre { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
      footer { color: var(--muted); margin-top: 28px; font-size: 0.92rem; }
    </style>
  </head>
  <body>
    <div id="login" class="login" hidden></div>
    <div id="app" hidden>
      <header>
        <strong>REA</strong>
        <nav id="nav"></nav>
        <p id="demo" class="warn" hidden></p>
        <div class="tools">
          <button id="theme" type="button"></button>
          <button id="lang" type="button"></button>
          <button id="logout" type="button"></button>
        </div>
      </header>
      <main id="main"></main>
    </div>

          noBilling: "No plans and no billing.",
          upload: "Upload an APK or binary",
          demoBanner: "Demo mode: uploads, GitHub, or the pinned APK only.",
          sandbox: "Docker sandbox",
          sandboxImage: "Docker image",
          cpus: "Sandbox CPUs (1 to 4)",

      const login = document.querySelector("#login");
      const app = document.querySelector("#app");
      const nav = document.querySelector("#nav");
      const main = document.querySelector("#main");
      const themeButton = document.querySelector("#theme");
      const langButton = document.querySelector("#lang");
      const logoutButton = document.querySelector("#logout");
      let lang = localStorage.getItem("rea-lang") === "en" ? "en" : "pt-BR";
      let theme = localStorage.getItem("rea-theme") === "dark" ? "dark" : "light";
      let me = null;
      let view = "home";
      let jobId = "";
      let generation = 0;
      let painting = false;
      const t = (key) => copy[lang][key] ?? key;
      const roleName = (role) => (role === "admin" ? t("admin") : t("operator"));
      const demo = document.querySelector("#demo");
      const stateLabel = (state) => t(state) || state;

      const el = (tag, attrs = {}, children = []) => {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(attrs)) {
          if (value === undefined) continue;
          if (key === "text") node.textContent = value;
          else node.setAttribute(key, value);
        }
        for (const child of children) if (child) node.append(child);
        return node;
      };

      const applyChrome = () => {
        document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
        document.documentElement.dataset.theme = theme;
        localStorage.setItem("rea-lang", lang);
        localStorage.setItem("rea-theme", theme);
        themeButton.textContent = theme === "dark" ? t("themeToLight") : t("themeToDark");
        langButton.textContent = t("lang");
        logoutButton.textContent = t("logout");
        demo.hidden = me?.demo !== true;
        demo.textContent = t("demoBanner");
      };

      const api = async (path, options) => {
        const response = await fetch(path, options);
        const type = response.headers.get("content-type") ?? "";
        const body = type.includes("json") ? await response.json() : null;
        return { ok: response.ok, status: response.status, body };
      };

      const message = (body) =>
        (lang === "en" ? body?.message_en : body?.message) || t("error");

      const footer = () => el("footer", { text: t("footer") });

      const engineCard = (key, row) => {
        let detail = row?.ready ? t("ready") : t("missing");
        if (key === "frida") detail = row?.ready ? t("notRun") : t("missing");
        if (key === "doctor") {
          if (row?.detail === "healthy") detail = t("healthy");
          else if (row?.detail === "not-healthy") detail = t("notHealthy");
          else detail = t("unavailable");
        }
        return el("article", { class: "card" }, [
          el("h2", { text: t(key) }),
          el("p", { text: detail }),
        ]);
      };

      const jobTable = (jobs) => {
        const table = el("table", {}, [
          el("thead", {}, [
            el("tr", {}, [
              el("th", { text: t("when") }),
              el("th", { text: t("state") }),
              el("th", { text: t("subject") }),
              el("th", { text: t("who") }),
            ]),
          ]),
        ]);
        const body = el("tbody");
        for (const job of jobs) {
          const button = el("button", { class: "quiet", type: "button", text: job.target });
          button.addEventListener("click", () => openJob(job.id));
          body.append(
            el("tr", {}, [
              el("td", { text: job.createdAt ?? "" }),
              el("td", { text: stateLabel(job.state) }),
              el("td", {}, [button]),
              el("td", { text: job.user ?? "" }),
            ]),
          );
        }
        table.append(body);
        return table;
      };

      const renderHome = async () => {
        const result = await api("/api/home");
        const data = result.body ?? {};
        const engines = data.engines ?? {};
        return el("section", {}, [
          el("h1", { text: t("home") }),
          el("h2", { text: t("engines") }),
          el("div", { class: "grid" }, [
            engineCard("ghidra", engines.ghidra),
            engineCard("jadx", engines.jadx),
            engineCard("rizin", engines.rizin),
            engineCard("frida", engines.frida),
            engineCard("doctor", engines.doctor),
          ]),
          el("h2", { text: t("queue") }),
          (data.queue ?? []).length === 0
            ? el("p", { class: "muted", text: t("empty") })
            : jobTable(data.queue),
          el("h2", { text: t("recent") }),
          (data.recent ?? []).length === 0
            ? el("p", { class: "muted", text: t("empty") })
            : jobTable(data.recent),
          footer(),
        ]);
      };

      const kindSelect = (selected) => {
        const select = el("select", { id: "kind", name: "kind" });
        for (const kind of ["auto", "javascript", "android", "native", "website", "dotnet"]) {
          const option = el("option", { value: kind, text: t(kind) });
          if (kind === selected) option.selected = true;
          select.append(option);
        }
        return select;
      };

      const renderNew = (preset = "") => {
        const error = el("p", { class: "warn" });
        const target = el("input", { id: "target", name: "target", type: "text", value: preset });
        target.setAttribute("autocomplete", "off");
        target.setAttribute("spellcheck", "false");
        const form = el("form", { class: "card" }, [
          el("label", { for: "target", text: t("target") }),
          target,
          el("label", { for: "kind", text: t("kind") }),
          kindSelect("auto"),
          el("label", { for: "priority", text: t("priority") }),
          prioritySelect(),
          el("label", { for: "fast", text: t("fast") }),
          checkbox("fast"),
          el("label", { for: "upload", text: t("upload") }),
          uploadInput(error),
          el("button", { class: "primary", type: "submit", text: t("run") }),
          error,
        ]);
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const response = await api("/api/analyze", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              target: target.value,
              kind: form.querySelector("#kind").value,
              priority: Number(form.querySelector("#priority").value),
              fast: form.querySelector("#fast").checked,
            }),
          });
          if (!response.ok) {
            error.textContent = message(response.body);
            return;
          }
          openJob(response.body.id);
        });
        return el("section", {}, [
          el("h1", { text: t("fresh") }),
          el("p", { class: "muted", text: t("runHint") }),
          el("p", { class: "warn", text: t("limitsNote") }),
          form,
          notEnabledCard(),
          footer(),
        ]);
      };

      const prioritySelect = () => {
        const select = el("select", { id: "priority", name: "priority" });
        for (const [value, label] of [
          ["0", "normal"],
          ["1", "high"],
          ["-1", "low"],
        ]) {
          select.append(el("option", { value, text: t(label) }));
        }
        return select;
      };

      const checkbox = (id) => {
        const input = el("input", { id, type: "checkbox" });
        input.style.width = "auto";
        return input;
      };

      const uploadInput = (error) => {
        const input = el("input", { id: "upload", type: "file" });
        input.addEventListener("change", async () => {
          const chosen = input.files?.[0];
          if (!chosen) return;
          const response = await fetch("/api/upload", {
            method: "POST",
            headers: { "x-rea-filename": chosen.name },
            body: chosen,
          });
          const type = response.headers.get("content-type") ?? "";
          const payload = type.includes("json") ? await response.json() : null;
          if (!response.ok) {
            error.textContent = message(payload);
            return;
          }
          openJob(payload.id);
        });
        return input;
      };

      const notEnabledCard = () =>
        el("article", { class: "card" }, [
          el("h2", { text: me?.sandbox ? t("dockerOn") : t("notEnabled") }),
          el("p", { text: me?.sandbox ? t("dockerOn") : t("dockerNote") }),
          el("p", { text: t("ramNote") }),
        ]);

      const artifactCards = (job) => {
        const wrap = el("div", { class: "grid" });
        const cards = (job.artifacts ?? []).filter(
          (item) => item.lang === "both" || item.lang === lang,
        );
        for (const item of cards) {
          const title = lang === "en" ? item.title_en : item.title_pt;
          const blurb = lang === "en" ? item.blurb_en : item.blurb_pt;
          const bits = [el("h2", { text: title ?? "" }), el("p", { text: blurb ?? "" })];
          if (typeof item.href === "string" && item.href.startsWith("/packages/")) {
            bits.push(el("a", { href: item.href, text: t("open") }));
          }
          if (typeof item.markdown_href === "string" && item.markdown_href.startsWith("/packages/")) {
            bits.push(document.createTextNode(" "));
            bits.push(el("a", { href: item.markdown_href, text: "Markdown" }));
          }
          wrap.append(el("article", { class: "card" }, bits));
        }
        return wrap;
      };

      const renderJob = async () => {
        const result = await api(`/api/jobs/${jobId}`);
        if (!result.ok) return el("p", { class: "warn", text: message(result.body) });
        const job = result.body;
        const active = job.state === "queued" || job.state === "running";
        const actions = el("div", { class: "row" });
        if (active) {
          const cancel = el("button", { class: "primary", type: "button", text: t("cancel") });
          cancel.addEventListener("click", async () => {
            await api(`/api/jobs/${job.id}/cancel`, { method: "POST" });
            await show("job");
          });
          actions.append(cancel);
        }
        const rerun = el("button", { type: "button", text: t("rerun") });
        rerun.addEventListener("click", async () => {
          const response = await api(`/api/jobs/${job.id}/rerun`, { method: "POST" });
          if (response.ok) openJob(response.body.id);
        });
        actions.append(rerun);
        if (/^[A-Za-z0-9-]+$/u.test(job.id)) {
          actions.append(el("a", { href: `/api/jobs/${job.id}/export.zip`, text: t("zip") }));
          actions.append(el("a", { href: `/reports/${job.id}`, text: t("report") }));

        lang = lang === "en" ? "pt-BR" : "en";
        applyChrome();
        paintNav();
        if (me) {
          await api("/api/settings", {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ language: lang }),
          });
          await show(view);
        } else showLogin();
      });
      logoutButton.addEventListener("click", async () => {
        await api("/api/logout", { method: "POST" });
        me = null;
        view = "home";
        showLogin();
      });
      setInterval(() => {
        if (painting || !me) return;
        if (!["home", "history", "job"].includes(view)) return;
        painting = true;
        render().finally(() => {
          painting = false;
        });
      }, 1000);
      boot();
    </script>
  </body>
</html>
