services:
  rea-admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:4174:4174"
    volumes:
      - rea-data:/data
    environment:
      REA_BIND: 0.0.0.0
      REA_ANALYZE_PORT: "4174"
      REA_ANALYZE_OUTPUT: /data/analyses
      REA_ADMIN_DIR: /data/admin
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4174/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    # Traefik owns ports 80 and 443. These labels are comments so Compose does not publish them.
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.rea.rule=Host(`rea.example.test`)
    #   - traefik.http.services.rea.loadbalancer.server.port=4174
volumes:
  rea-data:
